<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>超位魔法 · 法阵</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235adca0'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./src/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
  <canvas id="stage"></canvas>

  <div class="hud">
    <div class="hud-title">超位魔法</div>
    <div class="hud-row"><span id="s-cam" class="dim">摄像头 待启动</span></div>
    <div class="hud-row">
      <span id="s-hands">手 0</span>
      <span id="s-fps" class="dim">FPS —</span>
    </div>
    <div class="hud-row">
      <select id="cam-select" class="cam-select" title="选择摄像头">
        <option>摄像头加载中…</option>
      </select>
    </div>
    <div class="hud-bloom">
      <span class="dim">展开</span>
      <div class="track"><i id="bloom-bar"></i></div>
      <span id="s-bloom" class="num">0.00</span>
    </div>
  </div>

  <div class="pip" id="pip">
    <video id="cam" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="pip-tag">H 键放大</div>
  </div>

  <div class="boot" id="boot">
    <div class="boot-card">
      <p id="boot-msg">正在请求摄像头…</p>
      <button id="boot-btn" hidden>重试</button>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
